<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dakku — clickable prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@380;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #241c14;
      --muted: #6d6458;
      --cream: #f3eee4;
      --paper: #faf6ee;
      --sage: #5d7d62;
      --sage-d: #3f5844;
      --gold: #c9a36a;
      --line: rgba(36, 28, 20, 0.1);
      --sidebar: #1a221c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: #d8d0c4;
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .win {
      width: min(1280px, 96vw);
      height: min(820px, 94vh);
      background: var(--cream);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 232px 1fr;
      grid-template-rows: 40px 1fr;
      box-shadow: 0 40px 80px rgba(36, 28, 20, 0.28);
    }
    .titlebar {
      grid-column: 1 / -1;
      background: #2a332c;
      color: #e8e2d6;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      gap: 10px;
    }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .dots i:nth-child(1) { background: #e06c5c; }
    .dots i:nth-child(2) { background: #e0b45c; }
    .dots i:nth-child(3) { background: #6db57a; }
    .proto {
      margin-left: auto;
      font-size: 11px;
      opacity: 0.7;
    }
    nav {
      background: var(--sidebar);
      color: #ddd6c8;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100%;
      min-height: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 16px;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(160deg, #8fb392, #4d6a52);
      display: grid; place-items: center; font-size: 16px;
    }
    .brand b { font-family: Fraunces, serif; font-weight: 650; color: #f4efe6; display: block; }
    .brand small { color: #9aa392; font-size: 11px; }
    .nav-btn {
      border: 0; background: transparent; color: inherit;
      text-align: left; padding: 9px 12px; border-radius: 8px;
      cursor: pointer; font: inherit; display: flex; gap: 10px; align-items: center;
    }
    .nav-btn:hover { background: rgba(255,255,255,.06); }
    .nav-btn.on { background: #3d5242; color: #fff; }
    .hint {
      margin-top: 18px; padding: 10px 12px; font-size: 11px; color: #9aa392;
      border-top: 1px solid rgba(255,255,255,.08);
      line-height: 1.45;
    }
    main { overflow: auto; padding: 22px 26px 28px; background:
      radial-gradient(1200px 400px at 80% -10%, #fff8ea, transparent), var(--cream); }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px;
    }
    h1 { font-family: Fraunces, serif; font-size: 30px; font-weight: 650; }
    .sub { color: var(--muted); margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button.p, button.g {
      border: 0; border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer; font-weight: 500;
    }
    button.p { background: var(--sage); color: #fff; }
    button.g { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .search {
      margin: 0 0 18px; width: 100%; max-width: 420px;
      padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; font: inherit;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card, .folder, .diary {
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit;
      box-shadow: 0 8px 20px rgba(36,28,20,.04);
    }
    .card:hover, .folder:hover, .diary:hover { transform: translateY(-2px); }
    .wave { height: 36px; display: flex; align-items: center; gap: 2px; margin: 8px 0 12px; }
    .wave span { width: 3px; background: var(--sage); border-radius: 2px; display: block; opacity: .75; }
    .title { font-family: Fraunces, serif; font-size: 17px; }
    .date { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .pill { font-size: 11px; background: #e7efe6; color: var(--sage-d); padding: 3px 8px; border-radius: 999px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .split { display: grid; grid-template-columns: 1.4fr .8fr; gap: 16px; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } .win { grid-template-columns: 1fr; } nav { display: none; } }
    .spot {
      background: #fff; border-radius: 14px; padding: 14px; border: 1px solid var(--line);
    }
    .spot .now { display: flex; gap: 10px; align-items: center; }
    .art { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, #1db954, #191414); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .note-row {
      display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center;
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
      cursor: pointer; font: inherit; text-align: left; color: inherit;
    }
    .play {
      width: 36px; height: 36px; border-radius: 50%; background: var(--sage); color: #fff; border: 0; cursor: pointer;
    }
    .crumb { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .crumb a { color: var(--sage-d); cursor: pointer; text-decoration: underline; }
    .player {
      background: #fff; border-radius: 16px; padding: 22px; border: 1px solid var(--line); max-width: 760px;
    }
    .bigwave { height: 64px; display: flex; align-items: flex-end; gap: 3px; margin: 18px 0; }
    .bigwave i { flex: 1; background: var(--sage); border-radius: 3px; opacity: .55; }
    .bigwave i.on { opacity: 1; background: var(--gold); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tts { margin-top: 18px; background: #f6f1e6; border-radius: 12px; padding: 14px; }
    .canvas-wrap { display: grid; grid-template-columns: 56px 1fr 240px; gap: 12px; min-height: 560px; }
    .rail, .insp {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .rail button, .insp button {
      border: 1px solid var(--line); background: #faf6ee; border-radius: 8px; padding: 8px; cursor: pointer; font: inherit;
    }
    .canvas {
      background: #fffdf8; border: 1px dashed #cfc3ae; border-radius: 4px;
      min-height: 560px; position: relative; overflow: hidden;
      box-shadow: inset 0 0 0 12px #f3e9d6;
    }
    .el {
      position: absolute; background: #fff; border: 1px solid #eadfcb; padding: 8px; cursor: move;
    }
    .el.sel { outline: 2px solid var(--sage); }
    .el img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .handle {
      position: absolute; width: 10px; height: 10px; background: var(--sage); right: -5px; bottom: -5px; cursor: nwse-resize;
    }
    .voice-chip {
      display: flex; gap: 8px; align-items: center; background: #eef5ee; padding: 8px 10px; border-radius: 10px;
    }
    .song-chip {
      display: flex; gap: 10px; align-items: center; background: #111; color: #eee;
      padding: 10px 12px; border-radius: 10px;
    }
    .song-chip .art { width: 44px; height: 44px; flex-shrink: 0; }
    .song-chip .date { color: #b9b3a8; }
    .song-chip b { font-size: 13px; }
    .el-label {
      position: absolute; top: -18px; left: 0; font-size: 10px; color: var(--sage-d); letter-spacing: .04em;
    }
    .modal {
      position: absolute; inset: 40px 0 0 232px; background: rgba(36,28,20,.35);
      display: none; place-items: center; z-index: 5;
    }
    .modal.show { display: grid; }
    .sheet {
      background: #fff; width: min(520px, 90%); border-radius: 16px; padding: 18px;
    }
    .sheet h3 { font-family: Fraunces, serif; margin-bottom: 10px; }
    .pick {
      width: 100%; text-align: left; padding: 10px; margin: 6px 0; border-radius: 10px;
      border: 1px solid var(--line); background: #faf6ee; cursor: pointer; font: inherit;
    }
    .hidden { display: none !important; }
    .tag { font-size: 11px; color: var(--sage-d); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0 16px; }
    .win.away { display: none; }
    .auth-gate {
      width: min(1280px, 96vw);
      height: min(820px, 94vh);
      background: var(--cream);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 40px 1fr;
      box-shadow: 0 40px 80px rgba(36, 28, 20, 0.28);
    }
    .auth-gate.away { display: none; }
    .auth-body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(800px 360px at 70% 0%, #fff8ea, transparent), var(--cream);
    }
    .auth-card {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 26px;
    }
    .auth-card h1 { font-size: 28px; }
    .auth-card label { display: block; font-size: 13px; margin: 14px 0 6px; }
    .auth-card input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); font: inherit; background: var(--paper);
    }
    .auth-err { color: #9b3b2e; font-size: 13px; margin-top: 10px; min-height: 1.2em; }
    .auth-links { margin-top: 16px; font-size: 13px; color: var(--muted); }
    .auth-links button { background: none; border: 0; color: var(--sage-d); font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
    .who {
      margin-top: auto; padding: 12px; border-top: 1px solid rgba(255,255,255,.08);
      font-size: 12px; color: #cfc6b8;
    }
    .who b { color: #f4efe6; display: block; font-size: 13px; }
    .who .mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .who .mini button {
      border: 0; background: #3d5242; color: #fff; border-radius: 999px;
      padding: 6px 10px; font: inherit; font-size: 11px; cursor: pointer;
    }
    .acct-pick { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-weight: 600; flex-shrink: 0;
    }
    .person {
      display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
      width: 100%; text-align: left; font: inherit; color: inherit;
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer;
    }
    .vis {
      display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: #efe8da; color: var(--sage-d); margin-top: 6px;
    }
    .vis.public { background: #e4f0e6; }
    .vis.mutual { background: #e7eef5; }
    .vis.zone { background: #f5ead6; }
    .vis.private { background: #eee; color: var(--muted); }
    .choice { border: 1px solid var(--line); background: #faf6ee; border-radius: 12px; padding: 12px; margin: 8px 0; width: 100%; text-align: left; font: inherit; cursor: pointer; }
    .choice.on { outline: 2px solid var(--sage); background: #eef5ee; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .checks label { display: flex; gap: 6px; align-items: center; background: #faf6ee; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="auth-gate" id="authGate">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      Dakku
      <span class="proto">Sign up · Sign in · Log in · follow · publish</span>
    </div>
    <div class="auth-body" id="authBody"></div>
  </div>
  <div class="win away" id="appWin">
    <div class="titlebar">
      <div class="dots"><i></i><i></i><i></i></div>
      Dakku
      <span class="proto">Follow like Spotify · Private · Zone · Mutual · Public</span>
    </div>
    <nav>
      <div class="brand">
        <div class="logo">🎙</div>
        <div><b>Dakku</b><small>Voice diaries · followable</small></div>
      </div>
      <button class="nav-btn on" data-go="home">⌂  Home</button>
      <button class="nav-btn" data-go="people">⌕  Search people</button>
      <button class="nav-btn" data-go="voices">◉  Voice notes</button>
      <button class="nav-btn" data-go="diaries">✎  Diaries</button>
      <button class="nav-btn" data-go="folders">📁  Folders</button>
      <button class="nav-btn" data-go="zones">◎  Zones</button>
      <button class="nav-btn" data-go="spotify">♫  Spotify</button>
      <p class="hint">Follow people like Spotify. Publish a diary as Private, Zone, Mutual, or Public.</p>
      <div class="who" id="who"></div>
    </nav>
    <main id="main"></main>
    <div class="modal" id="modal"></div>
  </div>

  <script>
    const AUTH_KEY = "vnd-accounts-v1";
    const SESSION_KEY = "vnd-session-v1";

    function accounts() {
      try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "[]"); }
      catch { return []; }
    }
    function saveAccounts(list) { localStorage.setItem(AUTH_KEY, JSON.stringify(list)); }
    function sessionId() { return localStorage.getItem(SESSION_KEY); }
    function setSession(id) {
      if (id) localStorage.setItem(SESSION_KEY, id);
      else localStorage.removeItem(SESSION_KEY);
    }
    function me() { return accounts().find((a) => a.id === sessionId()) || null; }
    function normEmail(e) { return (e || "").trim().toLowerCase(); }
    async function hashPass(pass) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vnd:" + pass));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    function uid() { return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    const authGate = document.getElementById("authGate");
    const authBody = document.getElementById("authBody");
    const appWin = document.getElementById("appWin");

    function showApp() {
      authGate.classList.add("away");
      appWin.classList.remove("away");
      paintWho();
      render("home");
    }
    function showAuth(screen, extra) {
      appWin.classList.add("away");
      authGate.classList.remove("away");
      authBody.innerHTML = authScreens[screen](extra || {});
    }
    function paintWho() {
      const u = me();
      const box = document.getElementById("who");
      if (!box || !u) return;
      const others = accounts().filter((a) => a.email === u.email).length;
      box.innerHTML = `<b>${u.name}</b>${u.email}<br><span>${others} account${others === 1 ? "" : "s"} on this email</span>
        <div class="mini">
          <button type="button" data-auth="switch">Switch account</button>
          <button type="button" data-auth="another">＋ Account</button>
          <button type="button" data-auth="out">Log out</button>
        </div>`;
    }

    const authScreens = {
      welcome() {
        return `<div class="auth-card">
          <h1>Dakku</h1>
          <p class="sub">Create an account, or sign in. One email can own many accounts. Follow people like Spotify. Publish diaries as Private, Zone, Mutual, or Public.</p>
          <div class="btns">
            <button class="p" type="button" data-auth="signup">Sign up</button>
            <button class="g" type="button" data-auth="signin">Sign in</button>
            <button class="g" type="button" data-auth="login">Log in</button>
            ${me() ? `<button class="g" type="button" data-auth="app">Back to app</button>` : ""}
          </div>
        </div>`;
      },
      signup() {
        return `<div class="auth-card">
          <h1>Sign up</h1>
          <p class="sub">Make a new account. You can sign up again later with the <em>same email</em> and a new account name.</p>
          <form id="authForm" data-kind="signup">
            <label>Account name</label>
            <input name="name" required placeholder="e.g. Pets journal" />
            <label>Email</label>
            <input name="email" type="email" required placeholder="you@email.com" />
            <label>Password</label>
            <input name="password" type="password" required minlength="4" />
            <label>Confirm password</label>
            <input name="confirm" type="password" required minlength="4" />
            <p class="auth-err" id="authErr"></p>
            <div class="btns"><button class="p" type="submit">Create account</button></div>
          </form>
          <p class="auth-links">Already have one? <button type="button" data-auth="signin">Sign in</button> · <button type="button" data-auth="login">Log in</button></p>
        </div>`;
      },
      signin() {
        return loginCard("Sign in");
      },
      login() {
        return loginCard("Log in");
      },
      pick(extra) {
        const list = extra.matches || [];
        return `<div class="auth-card">
          <h1>Choose an account</h1>
          <p class="sub">${extra.email} has ${list.length} accounts. Pick which one to open.</p>
          <div class="acct-pick">
            ${list.map((a) => `<button class="pick" type="button" data-enter="${a.id}"><b>${a.name}</b><div class="date">Created ${new Date(a.created).toLocaleDateString()}</div></button>`).join("")}
          </div>
          <p class="auth-links"><button type="button" data-auth="${me() ? "app" : "welcome"}">Back</button></p>
        </div>`;
      }
    };

    function loginCard(title) {
      return `<div class="auth-card">
        <h1>${title}</h1>
        <p class="sub">Use your email and password. If that email has several accounts, you will pick one next.</p>
        <form id="authForm" data-kind="login">
          <label>Email</label>
          <input name="email" type="email" required />
          <label>Password</label>
          <input name="password" type="password" required />
          <p class="auth-err" id="authErr"></p>
          <div class="btns"><button class="p" type="submit">${title}</button></div>
        </form>
        <p class="auth-links">New here? <button type="button" data-auth="signup">Sign up</button> · <button type="button" data-auth="welcome">Back</button></p>
      </div>`;
    }

    async function doSignup(form) {
      const name = form.name.value.trim();
      const email = normEmail(form.email.value);
      const password = form.password.value;
      const confirm = form.confirm.value;
      const err = document.getElementById("authErr");
      if (password !== confirm) { err.textContent = "Passwords do not match."; return; }
      const list = accounts();
      if (list.some((a) => a.email === email && a.name.toLowerCase() === name.toLowerCase())) {
        err.textContent = "That email already has an account named “" + name + "”. Pick another name.";
        return;
      }
      const rec = { id: uid(), name, email, pass: await hashPass(password), created: Date.now() };
      list.push(rec);
      saveAccounts(list);
      setSession(rec.id);
      showApp();
    }

    async function doLogin(form) {
      const email = normEmail(form.email.value);
      const pass = await hashPass(form.password.value);
      const err = document.getElementById("authErr");
      const matches = accounts().filter((a) => a.email === email && a.pass === pass);
      if (!matches.length) {
        err.textContent = "No account matches that email and password.";
        return;
      }
      if (matches.length === 1) {
        setSession(matches[0].id);
        showApp();
        return;
      }
      showAuth("pick", { email, matches });
    }

    authBody.addEventListener("submit", (e) => {
      const form = e.target.closest("#authForm");
      if (!form) return;
      e.preventDefault();
      if (form.dataset.kind === "signup") doSignup(form);
      else doLogin(form);
    });

    const voices = [
      { id: "v1", title: "My dog barked to the birds", date: "Sunday, August 23, 2026", time: "7:14 PM", dur: "1:24", folder: "Pets" },
      { id: "v2", title: "Morning walk by the river", date: "Saturday, August 22, 2026", time: "8:02 AM", dur: "0:48", folder: "Daily" },
      { id: "v3", title: "Recipe I don't want to forget", date: "Friday, August 21, 2026", time: "6:40 PM", dur: "2:11", folder: "Kitchen" },
      { id: "v4", title: "Late night thoughts", date: "Thursday, August 20, 2026", time: "11:18 PM", dur: "3:02", folder: "Daily" }
    ];
    const songs = [
      { id: "s1", title: "Birds of a Feather", artist: "SZA" },
      { id: "s2", title: "Sunsetz", artist: "Cigarettes After Sex" },
      { id: "s3", title: "Holocene", artist: "Bon Iver" }
    ];
    let attachedSong = songs[0];
    const diaries = [
      { id: "d1", title: "Backyard in August", date: "August 23, 2026", folder: "Pets", hasVoice: true, hasSong: true, vis: "mutual", zoneId: null },
      { id: "d2", title: "River morning", date: "August 22, 2026", folder: "Travel", hasVoice: false, hasSong: false, vis: "private", zoneId: null }
    ];
    const folders = [
      { name: "Pets", voices: 4, diaries: 1 },
      { name: "Daily", voices: 6, diaries: 2 },
      { name: "Travel", voices: 2, diaries: 3 },
      { name: "Kitchen", voices: 1, diaries: 0 }
    ];
    const people = [
      { id: "p1", name: "Mira Chen", handle: "mira", color: "#6f8f6a", bio: "Pets, backyard evenings, slow songs." },
      { id: "p2", name: "Arka Putra", handle: "arka", color: "#c4a36a", bio: "Travel notes and river mornings." },
      { id: "p3", name: "Lina Park", handle: "lina", color: "#6d8494", bio: "Recipes I don’t want to forget." },

        { title: "Only my close circle", date: "August 16, 2026", vis: "zone", zoneName: "Close circle", includesMe: true },
        { title: "Family dinner", date: "August 12, 2026", vis: "zone", zoneName: "Family", includesMe: false },
        { title: "Unsent letter", date: "August 10, 2026", vis: "private" }
      ],

    function isMutual(id) { return iFollow.includes(id) && followsMe.includes(id); }

    function avatar(p, size) {

    const views = {

                <span class="el-label">VOICE NOTE</span>

                  <span class="play">▶</span>
                  <div>
                    <div class="title" style="font-size:14px">My dog barked to the birds</div>

      },
      spotify() {
        setNav("spotify");
        return `
          <h1>Spotify</h1>
          <p class="sub" style="margin:8px 0 18px">Connect your account here. You attach a song later, on the diary page, as an element — same as adding a photo.</p>
          <div class="spot" style="max-width:420px">
            <div class="now"><div class="art"></div><div><b>Connected as Sheren</b><div class="date">Premium · pick songs inside a diary</div></div></div>
            <div class="btns"><button class="p" data-go="editor">Open a diary and attach a song</button></div>
          </div>`;
      },
      people() {
        setNav("people");
        const q = peopleQ.trim().toLowerCase();
        const list = people.filter((p) => !q || p.name.toLowerCase().includes(q) || p.handle.includes(q));
        return `
          <div class="top">
            <div>
              <h1>Search people</h1>
              <p class="sub">Find a user page. Follow like Spotify. If you follow each other, you are Mutual — friends on Dakku.</p>
            </div>

          <input class="search" id="peopleSearch" placeholder="Search a name or @handle…" value="${peopleQ.replace(/"/g, "&quot;")}" />
          <div class="list">
            ${list.map((p) => `
              <button class="person" data-profile="${p.id}">

                  <div class="date">@${p.handle} · ${isMutual(p.id) ? "friends · you follow each other" : iFollow.includes(p.id) ? "you follow them" : followsMe.includes(p.id) ? "follows you" : "not following"}</div>

      },
      profile() {
        setNav("people");
        const p = people.find((x) => x.id === viewingId) || people[0];
        const shown = (othersDiaries[p.id] || []).filter(canSeeOther);
        const hidden = (othersDiaries[p.id] || []).length - shown.length;
        return `
          <p class="crumb"><a data-go="people">People</a> / @${p.handle}</p>
          <div class="top">
            <div style="display:flex;gap:14px;align-items:center">
              ${avatar(p, 64)}
              <div>
                <h1>${p.name}</h1>
                <p class="date">@${p.handle} · ${p.bio}</p>
                <p class="tag" style="margin-top:6px">${iFollow.filter(Boolean).length ? "" : ""}${isMutual(p.id) ? "Mutual friends — you follow each other" : iFollow.includes(p.id) ? "You follow this page" : "You do not follow them yet"}</p>
              </div>
            </div>
            <div class="actions">
              <button class="${iFollow.includes(p.id) ? "g" : "p"}" data-follow="${p.id}">${iFollow.includes(p.id) ? "Following ✓" : "Follow"}</button>

      zones() {
        setNav("zones");

    function card(v) {
      return `<button class="card" data-open="voice" data-id="${v.id}">
        <div class="wave">${bars()}</div>
        <div class="title">${v.title}</div>
        <div class="date">${v.date}</div>
        <div class="row" style="margin-top:10px"><span class="pill">${v.dur}</span><span class="tag">${v.folder}</span></div>
      </button>`;
    }
    function diaryCard(d) {
      return `<button class="diary" data-go="editor">
        <div style="height:88px;border-radius:8px;background:linear-gradient(135deg,#efe4cc,#c9d7b8);margin-bottom:10px"></div>
        <div class="title">${d.title}</div>
        <div class="date">${d.date}</div>
        <div class="tag" style="margin-top:6px">${d.folder}${d.hasVoice ? " · voice note" : ""}${d.hasSong ? " · song attached" : ""}</div>
        <span class="vis ${d.vis}">${visText(d)}</span>
      </button>`;
    }

    const main = document.getElementById("main");
    const modal = document.getElementById("modal");

    function render(name) {
      main.innerHTML = views[name]();
      bindEditor();
      const search = document.getElementById("peopleSearch");
      if (search) {
        search.focus();
        search.setSelectionRange(search.value.length, search.value.length);
      }
    }

    document.body.addEventListener("input", (e) => {
      if (e.target.id === "peopleSearch") {
        peopleQ = e.target.value;
        render("people");
      }
    });
    document.body.addEventListener("change", (e) => {
      const box = e.target.closest("[data-zone-member]");
      if (!box) return;
      const [zid, pid] = box.dataset.zoneMember.split(":");
      const z = zones.find((x) => x.id === zid);
      if (!z) return;
      if (box.checked) {
        if (!z.members.includes(pid)) z.members.push(pid);
      } else z.members = z.members.filter((x) => x !== pid);
      render("zones");
    });

    function inspect(kind) {
      const box = document.getElementById("insp");
      if (!box) return;
      const copy = {
        song: `<b>Selected: song</b><p class="date">Attached to this diary only. Play, change, or remove it like any other element.</p><button>Play on Spotify</button><button data-open-modal="song">Change song</button><button>Remove from page</button>`,
        photo: `<b>Selected: photo</b><p class="date">Drag to move. Sage corner handle to resize.</p><button>Bring forward</button><button>Opacity 100%</button>`,
        voice: `<b>Selected: voice note</b><p class="date">A recording placed on this page. It still lives in Voice notes.</p><button>Play</button><button>Remove from page</button>`,
        text: `<b>Selected: text</b><p class="date">Type on the page. This is not a voice note.</p>`
      };
      box.innerHTML = copy[kind] || copy.photo;
    }

    function bindEditor() {
      const canvas = document.getElementById("canvas");
      if (!canvas) return;
      let drag = null;
      canvas.querySelectorAll(".el").forEach((el) => {
        el.addEventListener("mousedown", (e) => {
          canvas.querySelectorAll(".el").forEach((n) => n.classList.remove("sel"));
          el.classList.add("sel");
          inspect(el.dataset.kind);
          const handle = e.target.closest(".handle");
          if (handle) {
            drag = { el, kind: "resize", x: e.clientX, y: e.clientY, w: el.offsetWidth, h: el.offsetHeight };
            return;
          }
          drag = { el, kind: "move", x: e.clientX - el.offsetLeft, y: e.clientY - el.offsetTop };
        });
      });
      const move = (e) => {
        if (!drag) return;
        if (drag.kind === "move") {
          drag.el.style.left = e.clientX - drag.x + "px";
          drag.el.style.top = e.clientY - drag.y + "px";
        } else {
          drag.el.style.width = Math.max(80, drag.w + (e.clientX - drag.x)) + "px";
          drag.el.style.height = Math.max(48, drag.h + (e.clientY - drag.y)) + "px";
        }
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", () => { drag = null; });
    }

    function openModal(kind) {
      if (kind === "insert") {
        modal.innerHTML = `<div class="sheet">
          <h3>Insert a voice note</h3>
          <p class="date" style="margin-bottom:10px">Adds a voice-note element on this diary.</p>
          ${voices.map((v) => `<button class="pick" data-insert="${v.id}"><b>${v.title}</b><div class="date">${v.date}</div></button>`).join("")}
          <button class="g" id="closeModal">Cancel</button>
        </div>`;
      } else if (kind === "song") {
        modal.innerHTML = `<div class="sheet">
          <h3>Attach a song to this diary</h3>
          <p class="date" style="margin-bottom:10px">The song becomes an element on this page — saved with this diary, not with the whole app.</p>
          ${songs.map((s) => `<button class="pick" data-song="${s.id}"><b>${s.title}</b><div class="date">${s.artist} · Spotify</div></button>`).join("")}
          <button class="g" id="closeModal">Cancel</button>
        </div>`;
      } else if (kind === "publish") {
        const d = diaries.find((x) => x.id === publishDiaryId) || diaries[0];
        modal.innerHTML = `<div class="sheet">
          <h3>Who can see this diary?</h3>
          <p class="date" style="margin-bottom:10px">Publish setting for this page only.</p>
          <button class="choice ${d.vis === "private" ? "on" : ""}" data-vis="private"><b>Private</b><div class="date">Only you.</div></button>
          <button class="choice ${d.vis === "zone" ? "on" : ""}" data-vis="zone"><b>Zone</b><div class="date">Only people in a Zone you choose. You can have many Zones.</div></button>
          ${d.vis === "zone" ? zones.map((z) => `<button class="pick" data-zone-pick="${z.id}"><b>◎ ${z.name}</b><div class="date">${z.members.length} people${d.zoneId === z.id ? " · selected" : ""}</div></button>`).join("") : ""}
          <button class="choice ${d.vis === "mutual" ? "on" : ""}" data-vis="mutual"><b>Mutual</b><div class="date">Only people you follow each other (friends on Dakku).</div></button>
          <button class="choice ${d.vis === "public" ? "on" : ""}" data-vis="public"><b>Public</b><div class="date">Everyone on Dakku.</div></button>
          <button class="g" id="closeModal">Done</button>
        </div>`;
      } else {
        modal.innerHTML = `<div class="sheet">
          <h3>Put this diary in a folder</h3>
          ${folders.map((f) => `<button class="pick" data-go="folder">${f.name}</button>`).join("")}
          <button class="g" id="closeModal">Cancel</button>
        </div>`;
      }
      modal.classList.add("show");
    }

    document.body.addEventListener("click", (e) => {
      const auth = e.target.closest("[data-auth]");
      const enter = e.target.closest("[data-enter]");
      if (auth) {
        const act = auth.dataset.auth;
        if (act === "out") { setSession(null); showAuth("welcome"); return; }
        if (act === "app") { showApp(); return; }
        if (act === "another") {
          showAuth("signup");
          queueMicrotask(() => {
            const u = me();
            const form = document.getElementById("authForm");
            if (u && form) form.email.value = u.email;
          });
          return;
        }
        if (act === "switch") {
          const u = me();
          const matches = accounts().filter((a) => a.email === u?.email);
          if (matches.length > 1) showAuth("pick", { email: u.email, matches });
          return;
        }
        showAuth(act);
        return;
      }
      if (enter) {
        setSession(enter.dataset.enter);
        showApp();
        return;
      }
      const profile = e.target.closest("[data-profile]");
      const follow = e.target.closest("[data-follow]");
      const vis = e.target.closest("[data-vis]");
      const zonePick = e.target.closest("[data-zone-pick]");
      const go = e.target.closest("[data-go]");
      const open = e.target.closest("[data-open]");
      const om = e.target.closest("[data-open-modal]");
      const pickSong = e.target.closest("[data-song]");
      if (e.target.id === "ttsBtn") document.getElementById("tts")?.classList.toggle("hidden");
      if (e.target.id === "closeModal" || e.target === modal) modal.classList.remove("show");
      if (pickSong) {
        attachedSong = songs.find((s) => s.id === pickSong.dataset.song) || attachedSong;
        diaries[0].hasSong = true;
        modal.classList.remove("show");
        render("editor");
        return;
      }
      if (e.target.closest("[data-insert]")) {
        modal.classList.remove("show");
        render("editor");
        return;
      }
      if (e.target.id === "newZone") {
        const name = prompt("Name this Zone", "Family");
        if (name && name.trim()) {
          zones.push({ id: "z" + Date.now(), name: name.trim(), members: [] });
          render("zones");
        }
        return;
      }
      if (profile) {
        viewingId = profile.dataset.profile;
        render("profile");
        return;
      }
      if (follow) {
        const id = follow.dataset.follow;
        if (iFollow.includes(id)) iFollow = iFollow.filter((x) => x !== id);
        else iFollow.push(id);
        render("profile");
        return;
      }
      if (vis) {
        const d = diaries.find((x) => x.id === publishDiaryId) || diaries[0];
        d.vis = vis.dataset.vis;
        if (d.vis !== "zone") d.zoneId = null;
        else if (!d.zoneId && zones[0]) d.zoneId = zones[0].id;
        openModal("publish");
        return;
      }
      if (zonePick) {
        const d = diaries.find((x) => x.id === publishDiaryId) || diaries[0];
        d.vis = "zone";
        d.zoneId = zonePick.dataset.zonePick;
        openModal("publish");
        return;
      }
      if (om) { openModal(om.dataset.openModal); return; }
      if (open) { render(open.dataset.open); return; }
      if (go) { render(go.dataset.go); }
    });

    if (me()) showApp();
    else showAuth("welcome");
  </script>
</body>
</html>
